name: CI

# Deliberately NOT filtered to web/**. `web` is a required status check on
# main, and a required check that is skipped never reports - it sits at
# "waiting for status" and the PR can never merge. A worker-only change would
# wedge itself. Running always costs a minute of runner time on commits that
# could not have broken the frontend, which is free: this repo is public, so
# Actions minutes are unmetered.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}      # allow manual runs from the Actions tab

# Push twice in a minute and the first run is cancelled rather than grinding
# on for another two minutes to report on a commit already replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"          # matches Vercel's default for Next 16
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # No Supabase env vars are set here, and that is deliberate: lib/supabase.ts
      # exports null without them and every caller in lib/data.ts checks for null,
      # so the build renders empty states instead of crashing. CI therefore needs
      # no secrets at all - and the service key stays as far from `web/` as ever.
      #
      # Ordered cheapest-first: lint and test take seconds, build takes a minute,
      # so the common failures surface without waiting on the slow step.
      - run: npm run lint
      - run: npm run test
      - run: npm run build
